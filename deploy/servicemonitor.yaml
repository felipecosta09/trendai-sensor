apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: trendai-sensor
  namespace: trendai-sensor
  labels:
    app: trendai-sensor
spec:
  selector:
    matchLabels:
      app: trendai-sensor
  namespaceSelector:
    matchNames:
      - trendai-sensor
  endpoints:
    - port: metrics
      interval: 30s
      path: /metrics
