# Sensor runtime configuration. Override per-environment (dev/stage/prod)
# with a Kustomize overlay or by editing this file before `kubectl apply`.
#
# SENSOR is the NDR appliance IP — must be reachable from every node the
# DaemonSet runs on. VNI is hex (see README). NDR_MTU is the link MTU
# between the node and the NDR, not the node's local MTU.
apiVersion: v1
kind: ConfigMap
metadata:
  name: trendai-sensor-config
  namespace: trendai-sensor
data:
  SENSOR: "10.0.3.57"
  VNI: "0"
  NDR_MTU: "1500"
  CAPTURE_MODE: "auto"
  LOG_LEVEL: "info"
  # HTTP listeners. These match the containerPorts in daemonset.yaml and the
  # Prometheus scrape annotation — change all three together if overriding.
  METRICS_ADDR: ":9090"
  HEALTH_ADDR: ":8080"
