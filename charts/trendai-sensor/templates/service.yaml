apiVersion: v1
kind: Service
metadata:
  name: {{ include "trendai-sensor.fullname" . }}
  namespace: {{ include "trendai-sensor.namespace" . }}
  labels:
    {{- include "trendai-sensor.labels" . | nindent 4 }}
spec:
  clusterIP: None
  selector:
    {{- include "trendai-sensor.selectorLabels" . | nindent 4 }}
  ports:
    - name: metrics
      port: 9090
      targetPort: 9090
      protocol: TCP
