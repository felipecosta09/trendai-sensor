name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write
  packages: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-qemu-action@v3

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build & push multi-arch image
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ghcr.io/${{ github.repository_owner }}/trendai-sensor:${{ github.ref_name }}

      - uses: azure/setup-helm@v4
        with:
          version: v3.15.0

      - name: Package chart
        id: package
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          helm package charts/trendai-sensor \
            --version "${VERSION}" \
            --app-version "${VERSION}"
          echo "tgz=trendai-sensor-${VERSION}.tgz" >> "$GITHUB_OUTPUT"

      - name: Create GitHub release with chart asset
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${GITHUB_REF_NAME}" \
            --generate-notes \
            "${{ steps.package.outputs.tgz }}"
