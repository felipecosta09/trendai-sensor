name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write
  packages: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-qemu-action@v3

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build & push multi-arch image
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ghcr.io/${{ github.repository_owner }}/trendai-sensor:${{ github.ref_name }}

      - uses: azure/setup-helm@v4
        with:
          version: v3.15.0

      # Chart version is SemVer (no v-prefix); appVersion carries the v-prefix
      # so templates/_helpers.tpl's `.Chart.AppVersion` fallback resolves to
      # the same tag that build-push-action just pushed to GHCR.
      - name: Package chart
        id: package
        run: |
          CHART_VERSION="${GITHUB_REF_NAME#v}"
          helm package . \
            --version "${CHART_VERSION}" \
            --app-version "${GITHUB_REF_NAME}"
          echo "tgz=trendai-sensor-${CHART_VERSION}.tgz" >> "$GITHUB_OUTPUT"

      # --generate-notes uses .github/release.yml for categorization.
      - name: Create GitHub release with chart asset
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${GITHUB_REF_NAME}" \
            --generate-notes \
            --title "${GITHUB_REF_NAME}" \
            "${{ steps.package.outputs.tgz }}"
