name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    name: test (race)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: '1.23'
          cache: true

      - name: Install BPF toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            clang llvm libbpf-dev linux-libc-dev

      - name: Generate BPF bindings
        run: cd internal/capture && go generate ./...

      - name: go test -race
        run: go test -race ./...
