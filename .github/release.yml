# Config for GitHub's auto-generated release notes (consumed by
# `gh release create --generate-notes` in .github/workflows/release.yml).
#
# PRs are bucketed into the first category whose labels match; PRs with no
# matching label land under "Other changes". Commits without PRs are listed
# verbatim under "Other changes" at the end.
changelog:
  exclude:
    labels:
      - ignore-for-release
      - duplicate
      - invalid
    authors:
      - dependabot
      - dependabot[bot]
  categories:
    - title: Features
      labels:
        - feature
        - enhancement
    - title: Fixes
      labels:
        - bug
        - fix
    - title: Security
      labels:
        - security
    - title: Documentation
      labels:
        - docs
        - documentation
    - title: Maintenance
      labels:
        - chore
        - refactor
        - ci
        - build
        - dependencies
    - title: Other changes
      labels:
        - "*"
