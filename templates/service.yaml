apiVersion: v1
kind: Service
metadata:
  name: {{ include "trendai-sensor.fullname" . }}
  namespace: {{ include "trendai-sensor.namespace" . }}
  labels:
    {{- include "trendai-sensor.labels" . | nindent 4 }}
spec:
  clusterIP: None
  selector:
    {{- include "trendai-sensor.selectorLabels" . | nindent 4 }}
  ports:
    {{- if .Values.prometheus.enabled }}
    - name: metrics
      port: {{ .Values.sensor.metricsAddr | trimPrefix ":" | int }}
      targetPort: {{ .Values.sensor.metricsAddr | trimPrefix ":" | int }}
      protocol: TCP
    {{- else }}
    # Prometheus disabled — expose only the health port so the headless
    # Service still resolves (it has no selector-less endpoints otherwise).
    - name: health
      port: 8080
      targetPort: 8080
      protocol: TCP
    {{- end }}
